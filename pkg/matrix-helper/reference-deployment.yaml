# Reference deployment for matrix-helper.
#
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: matrix-config
  namespace: matrix

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: matrix-helper
  namespace: matrix
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "update"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "patch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create"]

---
# ClusterRole: read the source client secret only, scoped by name via
# resourceNames. The grant is cluster-scoped (that secret name in any
# namespace), which in practice is the single secret in keycloak; using a
# ClusterRole avoids deploying any objects into the keycloak namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: matrix-helper
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["keycloak-client-secret-client-matrix"]
  verbs: ["get"]

---
# Bind the existing matrix-config ServiceAccount to the matrix Role.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: matrix-helper
  namespace: matrix
subjects:
- kind: ServiceAccount
  name: matrix-config
  namespace: matrix
roleRef:
  kind: Role
  name: matrix-helper
  apiGroup: rbac.authorization.k8s.io

---
# Bind the matrix-config ServiceAccount (in the matrix namespace) to the
# ClusterRole.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: matrix-helper
subjects:
- kind: ServiceAccount
  name: matrix-config
  namespace: matrix
roleRef:
  kind: ClusterRole
  name: matrix-helper
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matrix-helper
  namespace: matrix
  labels:
    app.kubernetes.io/name: matrix-helper
    app.kubernetes.io/part-of: matrix-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: matrix-helper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: matrix-helper
        app.kubernetes.io/part-of: matrix-stack
    spec:
      serviceAccountName: matrix-config
      containers:
      - name: matrix-helper
        image: ghcr.io/thomasbuchinger/homelab-api:latest
        command: ["/app/matrix-helper"]
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: MATRIX_HELPER_CLIENTSECRET_NAMESPACE
          value: "keycloak"
        - name: MATRIX_HELPER_CLIENTSECRET_NAME
          value: "keycloak-client-secret-client-matrix"
        - name: MATRIX_HELPER_CLIENTSECRET_KEY
          value: "CLIENT_SECRET"
        - name: MATRIX_HELPER_BOT_USERNAME
          valueFrom:
            secretKeyRef:
              name: eso-bot-credentials
              key: BOT_USERNAME
        - name: MATRIX_HELPER_BOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: eso-bot-credentials
              key: BOT_PASSWORD
        livenessProbe:
          httpGet:
            path: /api/livez
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/readyz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
